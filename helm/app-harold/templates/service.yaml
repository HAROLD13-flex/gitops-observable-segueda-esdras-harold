apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-app-harold-service
  labels:
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: app-harold
    release: {{ .Release.Name }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
