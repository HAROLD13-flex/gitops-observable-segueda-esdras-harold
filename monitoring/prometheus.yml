global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "monitoring-harold"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "node_exporter"
    static_configs:
      - targets:
          - "192.168.229.158:9100"
          - "192.168.229.159:9100"
          - "192.168.229.160:9100"
        labels:
          cluster: "gitops-harold"
  - job_name: "kube-state-metrics"
    static_configs:
      - targets:
          - "192.168.229.158:30091"
        labels:
          cluster: "gitops-harold"
