apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-harold-deployment
  labels:
    app: app-harold
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-harold
  template:
    metadata:
      labels:
        app: app-harold
    spec:
      containers:
      - name: web-app
        image: harold78/app-harold:v1.0.0
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
